{% extends "base.html" %}
{% block title %}{{ code }} · {{ app_name }}{% endblock %}
{% block content %}
<section class="page error-page">
  <div class="container">
    <p class="eyebrow">Error</p>
    <h1 class="page__title">{{ code }}</h1>
    <p class="muted">{{ message }}</p>
    <p><a class="btn btn--ghost" href="{{ url_for('main.index') }}">Back home</a></p>
  </div>
</section>
{% endblock %}
